<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#09080D">
<title>A special inconvenience for Mantaka</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500&display=swap">
<style>
/* ===== COLOURS: EDIT HERE ===== */
:root{
  --ob:#09080D;   /* background */
  --vi:#21142E;   /* cards */
  --pu:#8B70AD;   /* accents */
  --moon:#E7DDF2; /* main text */
  --grey:#AAA4B3; /* soft text */
  --red:#C8102E;  /* vampire red */
}
/* ===== STYLES (no need to touch) ===== */
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{background:var(--ob);color:var(--moon);font:16px/1.7 Inter,system-ui,sans-serif;overflow-x:hidden;padding-bottom:env(safe-area-inset-bottom)}
canvas{position:fixed;inset:0;z-index:0;pointer-events:none}
#fx{z-index:20}
main{position:relative;z-index:1;max-width:560px;margin:0 auto}
.bar{position:fixed;top:0;left:0;height:3px;width:0;background:var(--red);box-shadow:0 0 10px var(--red);z-index:30}
section{padding:72px 20px;display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center}
.hero{min-height:100svh;justify-content:center;padding-top:max(40px,env(safe-area-inset-top))}
.reveal{opacity:0;transform:translateY(28px);transition:opacity .8s,transform .8s}
.reveal.in{opacity:1;transform:none}
h1,h2{font-family:Cinzel,serif;letter-spacing:.04em;font-weight:700;line-height:1.2}
h1{font-size:clamp(2.2rem,11vw,3.4rem);text-shadow:0 0 26px var(--red);min-height:2.4em}
h2{font-size:clamp(1.5rem,7vw,2rem)}
.sub{color:var(--grey)}
.red{color:var(--red)}
.btn{background:transparent;color:var(--moon);border:1px solid var(--red);padding:14px 30px;border-radius:40px;font:inherit;cursor:pointer;box-shadow:0 0 14px rgba(200,16,46,.3);transition:.2s;min-height:48px}
.btn:active{background:var(--red);transform:scale(.97)}
.timers{display:grid;gap:12px;width:100%}
.t{background:var(--vi);border:1px solid #3a2652;border-radius:16px;padding:14px}
.t b{display:block;font-family:Cinzel,serif;font-size:1.25rem}
.t span{font-size:.78rem;color:var(--grey)}
.down{font-size:1.6rem;animation:bob 1.6s ease-in-out infinite;color:var(--red);margin-top:10px}
@keyframes bob{50%{transform:translateY(10px)}}
.card{background:var(--vi);border:1px solid #3a2652;border-radius:18px;padding:18px;width:100%;text-align:left}
.chat{display:flex;flex-direction:column;gap:6px;width:100%}
.b{max-width:82%;padding:9px 14px;border-radius:18px;font-size:.95rem;text-align:left}
.me{align-self:flex-start;background:#2c1a40;border-bottom-left-radius:4px}
.her{align-self:flex-end;background:#3b1520;color:#ffd7de;border-bottom-right-radius:4px;margin-bottom:10px}
.count{font-family:Cinzel,serif;font-size:3.2rem;color:var(--red);text-shadow:0 0 18px var(--red);line-height:1}
.cert{display:none;border:2px double var(--pu);padding:22px;border-radius:14px;background:var(--vi);width:100%}
.cert.show{display:block;animation:pop .6s}
@keyframes pop{from{opacity:0;transform:scale(.9)}}
.grid{display:grid;gap:12px;width:100%}
.grid .card{cursor:pointer;text-align:center;transition:.2s}
.grid .card:active{transform:scale(.98)}
.grid .card.open{border-color:var(--red)}
.grid .card p{display:none;margin-top:10px;color:var(--grey);font-size:.95rem}
.grid .card.open p{display:block;animation:pop .4s}
.vn{display:grid;gap:12px;width:100%}
.vn small{display:block;color:var(--grey);margin-bottom:8px}
.vn em{display:none;font-size:.78rem;color:var(--red);font-style:normal}
audio{width:100%;height:44px}
.gal{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.photo{aspect-ratio:4/5;border-radius:16px;border:1px solid var(--pu);box-shadow:0 0 24px rgba(200,16,46,.2);overflow:hidden;background:var(--vi);display:flex;align-items:center;justify-content:center;width:100%}
.photo img{width:100%;height:100%;object-fit:cover}
.photo.ph{border-style:dashed;color:var(--grey);font-size:.75rem;padding:10px;flex-direction:column;gap:4px;word-break:break-all}
.photo.ph b{font-size:2rem}
.gift{font-size:6rem;cursor:pointer;animation:bob 2s ease-in-out infinite;filter:drop-shadow(0 0 18px var(--red));padding:10px}
.lines{display:none;width:100%}
.lines.show{display:block}
.lines p{opacity:0;transform:translateY(10px);transition:.7s;margin:10px 0}
.lines p.s{opacity:1;transform:none}
.letter p{margin:14px 0;font-size:1.05rem}
.bat{position:fixed;font-size:2rem;z-index:2;pointer-events:none;animation:fly 10s linear infinite}
@keyframes fly{from{transform:translateX(-10vw)}50%{transform:translateX(50vw) translateY(-50px)}to{transform:translateX(110vw) translateY(20px)}}
.arena{position:relative;width:100%;height:320px;border:1px dashed var(--pu);border-radius:18px;background:radial-gradient(circle at 50% 100%,#2a1038,transparent 70%);overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.rafi{position:absolute;font-size:3.4rem;line-height:1;transition:left .9s linear,top .9s linear}
.rafi small{display:block;font:500 .7rem Inter;color:var(--grey);text-align:center}
.sandal{position:absolute;font-size:2.2rem;line-height:1;pointer-events:none;transition:left .35s ease-out,top .35s ease-out,transform .35s linear}
.say{position:absolute;font-size:.8rem;background:var(--vi);border:1px solid var(--red);border-radius:10px;padding:4px 10px;pointer-events:none;white-space:nowrap;animation:pop .3s}
.score{font-family:Cinzel,serif;font-size:1.1rem}
footer{height:60px}
</style>
</head>
<body>
<div class="bar" id="bar"></div>
<canvas id="stars"></canvas><canvas id="fx"></canvas>

<main>
<!-- 1: OPENING -->
<section class="hero" id="s1">
  <p class="sub" id="c-kicker"></p>
  <h1 id="c-title"></h1>
  <div class="timers">
    <div class="t"><b id="cd">--</b><span id="c-cdlabel"></span></div>
    <div class="t"><b id="age">--</b><span id="c-agelabel"></span></div>
  </div>
  <button class="btn" id="c-start" onclick="document.getElementById('s2').scrollIntoView()"></button>
  <div class="down">↓</div>
</section>

<!-- 2: SPELLING -->
<section class="reveal" id="s2">
  <h2 id="c-s2h"></h2>
  <p class="sub" id="c-s2p"></p>
  <div class="count"><span id="n">0</span>+</div>
  <p class="sub" id="c-s2count"></p>
  <div class="chat" id="chat"></div>
  <button class="btn" id="c-certbtn" onclick="document.getElementById('cert').classList.add('show');confetti()"></button>
  <div class="cert" id="cert"></div>
</section>

<!-- 3: ARCHIVE -->
<section class="reveal" id="s3">
  <h2 id="c-s3h"></h2>
  <p class="sub" id="c-s3p"></p>
  <div class="grid" id="cards"></div>
  <h2 id="c-vnh" style="margin-top:26px"></h2>
  <div class="vn" id="vn"></div>
  <div class="gal" id="gallery"></div>
</section>

<!-- 4: BIRTHDAY -->
<section class="reveal" id="s4">
  <h2 id="c-s4h"></h2>
  <p class="sub" id="c-s4p"></p>
  <div class="gift" id="gift" onclick="openGift()">🎁</div>
  <p class="sub" id="gtip">tap the box</p>
  <div class="lines" id="lines"></div>
</section>

<!-- 5: LETTER -->
<section class="reveal" id="s5">
  <h2 id="c-s5h"></h2>
  <div class="card letter" id="letter"></div>
</section>

<!-- 6: ENDING + GAME -->
<section class="reveal" id="s6">
  <h1 id="c-endtitle" style="min-height:0"></h1>
  <p id="c-end1"></p>
  <p class="sub" id="c-end2"></p>
  <p class="sub" id="c-end3"></p>
  <p class="sub" id="c-gamehint"></p>
  <div class="arena" id="arena"><div class="rafi" id="rafi">😎<small>Rafi</small></div></div>
  <div class="score">🩴 thrown: <span id="thrown">0</span> &nbsp;|&nbsp; hits: <span class="red" id="hits">0</span></div>
  <button class="btn" id="c-replay" onclick="window.scrollTo({top:0})"></button>
</section>
<footer></footer>
</main>

<script>
/* =====================================================================
   CONFIG: EDIT EVERYTHING HERE. Text in quotes. Keep the commas.
   ===================================================================== */
const CONFIG = {

  /* ---- Birthday (month is 1-12) ---- */
  bday: { year: 2007, month: 11, day: 19 },

  /* ---- Part 1: Opening ---- */
  kicker: "🦇 psst. this page is for one person only.",
  title: "A special inconvenience for Mantaka.",
  cdLabel: "until your birthday (19 Nov)",
  ageLabel: "how long you've been tormenting the world",
  startBtn: "Accha, dekhi ki bal banaiso.",

  /* ---- Part 2: Spelling thank-you ---- */
  s2Title: "A formal announcement",
  s2Intro: "Before we proceed, I would like to formally thank Mantaka for her endless service to the English language.",
  s2CountLabel: "times she has corrected my spelling",
  s2CountTo: 170,
  /* [my message, her correction]. Add real ones from your chats! */
  spelling: [
    ["Piriods e ki sobai emon kore 👀", "Period* + spelling shikh"],
    ["I falled asleep", "Fell hobe na?"],
    ["Thethoscope", "Stethoscope 🩺 🙂"],
    ["Alhamdurilla", "Lillah*"],
    ["Sugery", "Sugary hobe na? 🙃"]
  ],
  certBtn: "Tap to receive your award",
  certTitle: "The World's BEST Spell Checker",
  certName: "Sheikh Maulana Mohammed Bin Ibrahim Ali Khan Mufti Al Imaam Kintuddin",
  certThanks: "Thank you for correcting my spellings all this time. Genuinely, how you still have the patience to understand what I'm trying to say is beyond me.",

  /* ---- Part 3: Archive. Add or remove cards freely ---- */
  s3Title: "The Mantaka Archive",
  s3Sub: "Tap a card. Evidence of our crimes.",
  cards: [
    ["🌙 The meeting", "Discord. Two strangers, zero idea what was coming. Block threats started shortly after."],
    ["🎭 The Rara incident", "The day you made a fake account named Rara and talked to me like nothing happened. Iconic. Criminal."],
    ["⏳ A few hundred years", "This friendship is scheduled to last a few hundred years. Not negotiable."],
    ["🐑 Selling fluffy", "[WRITE: the selling fluffy story]"],
    ["👀 Meeting with Ash", "[WRITE: the Ash story]"],
    ["📚 The exam you didn't study for", "[WRITE: the exam story]"]
  ],

  /* Voice notes: put cut clips in assets/ */
  vnTitle: "How people react when you enter the room",
  voiceNotes: [
    { label: "voice note 1", file: "assets/voice1.mp3" },
    { label: "voice note 2", file: "assets/voice2.mp3" },
    { label: "voice note 3", file: "assets/voice3.mp3" }
  ],

  /* Photos (missing file = placeholder box) */
  galleryPhotos: ["assets/photo1.jpg", "assets/photo2.jpg", "assets/photo4.jpg", "assets/photo5.jpg"],

  /* ---- Part 4: Birthday ---- */
  s4Title: "Okay, enough nonsense.",
  s4Sub: "It's your birthday.",
  /* Lines appear one by one. Start a line with "!" to make it red. */
  birthdayLines: [
    "Ayoooo Mantaka.",
    "Happy birthdayyyyy. 🎂",
    "I made this for you.",
    "You better appreciate this.",
    "Jokes aside, I'm really glad I met you. And I hope this next year gives you a lot of things to look forward to, things to talk about, and things that make you happy.",
    "Also, this friendship is officially scheduled to last a few hundred years. Any objections may be submitted in writing and promptly ignored.",
    "Anyway.",
    "Happy birthday, Sheikh Maulana Mohammed Bin Ibrahim Ali Khan Mufti Al Imaam Kintuddin.",
    "!Your best gift is me. Obviously. Don't argue."
  ],
  birthdayPhoto: "assets/photo3.jpg",

  /* ---- Part 5: Letter. One paragraph per line ---- */
  s5Title: "The actual letter",
  letter: [
    "Okay so. No jokes for a bit.",
    "You're the nicest, prettiest, coolest person I know. I'm saying it once, don't make it weird.",
    "Last birthday of mine, you stayed and talked to me and didn't let me feel lonely. I didn't say anything then. I'm saying it now. Thank you.",
    "I like your intelligence, your coolness, your resilience, and yes, even the explosive anger. Especially when it's not pointed at me.",
    "I hope this year is your best yet. I hope you pass and win every exam. I hope the HSC result feels like proof of how hard you worked. And I hope you take a real step toward the place you want to go.",
    "I'm proud of you. Genuinely.",
    "And I'm staying. Few hundred years, remember?"
  ],

  /* ---- Part 6: Ending + sandal game ---- */
  endTitle: "MANTAKA",
  end1: "Anyway. Happy birthday. 🩴",
  end2: "Our friendship is required to last a few hundred years.",
  end3: "Block threats will resume tomorrow.",
  gameHint: "Final boss: me. Tap the box to throw a chappal. 🩴",
  rafiEmoji: "😎",
  rafiHitEmoji: "😵",
  hitLines: ["Ouch!! Okay okay sorry", "Accha accha, ami bhul korsi", "Dhoner bal Rafu is down 💀", "Violence is not the answer", "Spelling mistake tai to?", "Block kor, but stop throwing"],
  missLines: ["Miss 😭", "Skill issue", "Not even close", "Aim shikh", "Chappal wasted"],
  winAt: 5,
  winLine: "Ok ok you win. Happy birthday, Kintu.",
  replayBtn: "Back to top ↑"
};

/* =====================================================================
   CODE (no need to touch below)
   ===================================================================== */
const $=id=>document.getElementById(id), C=CONFIG;
const pad=x=>String(x).padStart(2,'0');
const set=(id,t)=>$(id).textContent=t;
const el=(tag,cls,txt)=>{const d=document.createElement(tag);if(cls)d.className=cls;if(txt!=null)d.textContent=txt;return d};

function photo(src){
  const d=el('div','photo'),i=new Image();i.alt='';i.src=src;
  i.onerror=()=>{d.className='photo ph';d.innerHTML='<b>📷</b>PHOTO GOES HERE<br>'+src};
  d.appendChild(i);return d;
}

/* fill text */
set('c-kicker',C.kicker);set('c-cdlabel',C.cdLabel);set('c-agelabel',C.ageLabel);set('c-start',C.startBtn);
set('c-s2h',C.s2Title);set('c-s2p',C.s2Intro);set('c-s2count',C.s2CountLabel);set('c-certbtn',C.certBtn);
set('c-s3h',C.s3Title);set('c-s3p',C.s3Sub);set('c-vnh',C.vnTitle);
set('c-s4h',C.s4Title);set('c-s4p',C.s4Sub);set('c-s5h',C.s5Title);
set('c-endtitle',C.endTitle);set('c-end1',C.end1);set('c-end2',C.end2);set('c-end3',C.end3);set('c-replay',C.replayBtn);set('c-gamehint',C.gameHint);

C.spelling.forEach(([a,b])=>{$('chat').appendChild(el('div','b me',a));$('chat').appendChild(el('div','b her',b))});
$('cert').innerHTML='<p class="sub">This certifies that</p><h2 class="red" style="margin:8px 0"></h2><p><b></b></p><p class="sub" style="margin-top:10px"></p>';
$('cert').children[1].textContent=C.certTitle;$('cert').children[2].firstChild.textContent=C.certName;$('cert').children[3].textContent=C.certThanks;
C.cards.forEach(([t,p])=>{const d=el('div','card');d.appendChild(el('div',null,t));d.appendChild(el('p',null,p));d.onclick=()=>d.classList.toggle('open');$('cards').appendChild(d)});
C.voiceNotes.forEach(v=>{const d=el('div','card');d.innerHTML='<small></small><audio controls preload="none"></audio><em>⚠ file missing: '+v.file+'</em>';d.querySelector('small').textContent=v.label;const a=d.querySelector('audio');a.src=v.file;a.addEventListener('error',()=>d.querySelector('em').style.display='block');$('vn').appendChild(d)});
C.galleryPhotos.forEach(s=>$('gal'+'lery').appendChild(photo(s)));
C.letter.forEach(t=>$('letter').appendChild(el('p',null,t)));

/* typewriter opening */
(function(){const h=$('c-title');let i=0;const t=setInterval(()=>{h.textContent=C.title.slice(0,++i);if(i>=C.title.length)clearInterval(t)},50)})();

/* scroll: reveal, progress bar, one-time triggers */
let counted=false,bated=false,gamed=false;
const io=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;e.target.classList.add('in');
  if(e.target.id=='s2'&&!counted){counted=true;countUp()}
  if(e.target.id=='s6'){if(!bated){bated=true;bats()}if(!gamed){gamed=true;startGame()}}
}),{threshold:.15});
document.querySelectorAll('.reveal').forEach(s=>io.observe(s));
addEventListener('scroll',()=>{const h=document.documentElement;$('bar').style.width=(scrollY/(h.scrollHeight-innerHeight)*100)+'%'},{passive:true});

/* timers */
function tick(){
  const now=new Date(),b=C.bday;
  let next=new Date(now.getFullYear(),b.month-1,b.day);
  const today=now.getMonth()==b.month-1&&now.getDate()==b.day;
  if(next<now&&!today)next=new Date(now.getFullYear()+1,b.month-1,b.day);
  if(today)$('cd').textContent='IT IS TODAY 🎂';
  else{const d=next-now;$('cd').textContent=Math.floor(d/864e5)+'d '+pad(Math.floor(d/36e5)%24)+'h '+pad(Math.floor(d/6e4)%60)+'m '+pad(Math.floor(d/1e3)%60)+'s'}
  let y=now.getFullYear()-b.year,last=new Date(b.year+y,b.month-1,b.day);
  if(last>now){y--;last=new Date(b.year+y,b.month-1,b.day)}
  const d=now-last;
  $('age').textContent=y+'y '+Math.floor(d/864e5)+'d '+pad(Math.floor(d/36e5)%24)+'h '+pad(Math.floor(d/6e4)%60)+'m '+pad(Math.floor(d/1e3)%60)+'s';
}
tick();setInterval(tick,1000);

function countUp(){let i=0;const t=setInterval(()=>{i+=5;if(i>=C.s2CountTo){i=C.s2CountTo;clearInterval(t)}$('n').textContent=i},25)}

/* gift */
function openGift(){
  $('gift').style.display='none';$('gtip').style.display='none';confetti();
  const l=$('lines');l.classList.add('show');
  C.birthdayLines.forEach(t=>{let red=t[0]=='!';const p=el('p',red?'red':'',red?t.slice(1):t);l.appendChild(p)});
  const ph=photo(C.birthdayPhoto);ph.style.margin='16px auto';ph.style.maxWidth='300px';l.appendChild(ph);
  [...l.querySelectorAll('p')].forEach((p,i)=>setTimeout(()=>p.classList.add('s'),i*900));
}

/* bats */
function bats(){for(let i=0;i<5;i++){const b=el('div','bat','🦇');b.style.top=(8+i*16)+'vh';b.style.animationDelay=(-i*2)+'s';document.body.appendChild(b)}}

/* stars + confetti */
const sc=$('stars'),sx=sc.getContext('2d');let S=[];
function rs(){sc.width=$('fx').width=innerWidth;sc.height=$('fx').height=innerHeight;S=Array.from({length:90},()=>({x:Math.random()*sc.width,y:Math.random()*sc.height,r:Math.random()*1.3+.3,p:Math.random()*6}))}
rs();addEventListener('resize',rs);
(function draw(t){sx.clearRect(0,0,sc.width,sc.height);S.forEach(s=>{sx.globalAlpha=.35+.65*Math.abs(Math.sin(t/1200+s.p));sx.fillStyle='#E7DDF2';sx.beginPath();sx.arc(s.x,s.y,s.r,0,7);sx.fill()});requestAnimationFrame(draw)})(0);
function confetti(){
  const fc=$('fx'),f=fc.getContext('2d'),cols=['#C8102E','#8B70AD','#E7DDF2'];
  const P=Array.from({length:130},()=>({x:innerWidth/2,y:innerHeight/2,vx:(Math.random()-.5)*14,vy:Math.random()*-14-2,c:cols[Math.random()*3|0],s:Math.random()*6+3}));
  let n=0;(function a(){f.clearRect(0,0,fc.width,fc.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.35;f.fillStyle=p.c;f.fillRect(p.x,p.y,p.s,p.s)});if(++n<140)requestAnimationFrame(a);else f.clearRect(0,0,fc.width,fc.height)})();
}

/* sandal game */
let thrown=0,hits=0;
const pick=a=>a[Math.random()*a.length|0];
function say(txt,x,y){const A=$('arena'),d=el('div','say',txt);A.appendChild(d);d.style.left=Math.max(4,Math.min(x-50,A.clientWidth-160))+'px';d.style.top=Math.max(4,y-34)+'px';setTimeout(()=>d.remove(),1100)}
function moveRafi(){const A=$('arena'),r=$('rafi');r.style.left=Math.random()*(A.clientWidth-64)+'px';r.style.top=(10+Math.random()*(A.clientHeight-150))+'px'}
function startGame(){$('rafi').firstChild.textContent=C.rafiEmoji;setTimeout(moveRafi,100);setInterval(moveRafi,1000)}
$('arena').addEventListener('pointerdown',e=>{
  const A=$('arena'),box=A.getBoundingClientRect(),x=e.clientX-box.left,y=e.clientY-box.top;
  thrown++;$('thrown').textContent=thrown;
  const s=el('div','sandal','🩴');s.style.left=(A.clientWidth/2-16)+'px';s.style.top=(A.clientHeight-36)+'px';A.appendChild(s);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{s.style.left=(x-18)+'px';s.style.top=(y-18)+'px';s.style.transform='rotate(720deg)'}));
  setTimeout(()=>{
    const r=$('rafi').getBoundingClientRect(),cx=r.left-box.left+r.width/2,cy=r.top-box.top+r.height/2;
    if(Math.hypot(x-cx,y-cy)<52){hits++;$('hits').textContent=hits;$('rafi').firstChild.textContent=C.rafiHitEmoji;
      say(hits==C.winAt?C.winLine:pick(C.hitLines),cx,cy);
      setTimeout(()=>$('rafi').firstChild.textContent=C.rafiEmoji,600);
      if(hits==C.winAt)confetti()}
    else say(pick(C.missLines),x,y);
    setTimeout(()=>s.remove(),500);
  },380);
});
</script>
</body>
</html>
