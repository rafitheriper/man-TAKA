<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a0c2f">
<meta name="color-scheme" content="dark">
<title>Mantaka — 19</title>
<meta name="description" content="A small thing, made for Mantaka's nineteenth.">
<meta name="robots" content="noindex, nofollow">

<meta property="og:type" content="website">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">

<style>
:root{
  --ink:#fbeedd;
  --muted:#dcc3da;
  --plum:#2a0c2f;
  --wine:#7a1638;
  --emerald:#0f5a52;
  --rose:#ff7aa6;
  --pink:#e8457a;
  --gold:#e9b949;
  --paper:#fbe6ea;
  --line:rgba(233,185,73,.36);
  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --black:'UnifrakturCook',Georgia,serif;
  --sans:'Inter',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  background-color:#2a0c2f;
  background-image:
    radial-gradient(60vmax 50vmax at 10% 6%,rgba(160,26,72,.6),transparent 70%),
    radial-gradient(55vmax 48vmax at 94% 32%,rgba(14,110,100,.55),transparent 70%),
    radial-gradient(70vmax 60vmax at 50% 104%,rgba(110,30,150,.65),transparent 70%),
    radial-gradient(40vmax 40vmax at 40% 60%,rgba(233,185,73,.08),transparent 70%);
  background-attachment:fixed;
  color:var(--ink);
  font:400 18px/1.7 var(--serif);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
  min-height:100vh;
}
img,svg,canvas,video{display:block;max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
[hidden]{display:none!important}

.frame{position:fixed;inset:14px;z-index:1;pointer-events:none;border:1px solid var(--line)}
.frame::after{content:"";position:absolute;inset:5px;border:1px solid rgba(233,185,73,.14)}
#embers{position:fixed;inset:0;z-index:90;pointer-events:none}
#confetti{position:fixed;inset:0;z-index:110;pointer-events:none}

/* BIRTHDAY OVERLAY */
#bday{position:fixed;inset:0;z-index:105;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 45%,rgba(42,12,47,.25),rgba(16,3,18,.72));opacity:0;pointer-events:none;transition:opacity .8s ease}
#bday.show{opacity:1;pointer-events:auto;cursor:pointer}
#bday .inner{text-align:center;padding:0 24px;transform:scale(.6) translateY(30px);opacity:0}
#bday.show .inner{animation:bdaypop 1s cubic-bezier(.2,1.4,.35,1) .25s forwards}
@keyframes bdaypop{to{transform:scale(1) translateY(0);opacity:1}}
#bday h2{font:400 clamp(3rem,14vw,7.5rem)/1 var(--black);background:linear-gradient(95deg,#ff8fb4 0%,#f7d36b 45%,#ff6f9c 90%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 34px rgba(255,111,156,.45));letter-spacing:.02em}
#bday .name{margin-top:18px;font:italic 400 clamp(1.3rem,4vw,2rem)/1.4 var(--serif);color:var(--ink);text-shadow:0 2px 20px rgba(20,0,20,.9)}
#bday .dismiss{margin-top:34px;font:500 9.5px/1 var(--sans);letter-spacing:.3em;text-transform:uppercase;color:rgba(220,195,218,.6)}
.hero .status.bday-today{color:var(--gold);text-shadow:0 0 12px rgba(233,185,73,.45)}

/* HERO */
.hero{min-height:82vh;min-height:82svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:80px 24px 40px}
.eyebrow{font:500 11px/1 var(--sans);letter-spacing:.3em;text-transform:uppercase;color:var(--gold);margin-bottom:clamp(22px,4vh,34px)}
.hero h1{font:400 clamp(3.6rem,17vw,8.5rem)/.95 var(--black);background:linear-gradient(95deg,#ff8fb4 0%,#f7d36b 45%,#ff6f9c 90%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 28px rgba(255,111,156,.25))}
.hero .sub{margin-top:clamp(20px,3vh,28px);font:italic 400 clamp(1.05rem,2.4vw,1.3rem)/1.6 var(--serif);color:var(--muted);max-width:34ch}
.hero .status{margin-top:14px;font:500 10.5px/1 var(--sans);letter-spacing:.24em;text-transform:uppercase;color:var(--rose)}
.hero .cue{margin-top:clamp(34px,6vh,52px);font:500 9.5px/1 var(--sans);letter-spacing:.28em;text-transform:uppercase;color:rgba(220,195,218,.55);animation:cue 3.2s ease-in-out infinite}
@keyframes cue{0%,100%{opacity:.45;transform:translateY(0)}50%{opacity:.9;transform:translateY(5px)}}

/* GIFTS - one long scroll */
.gifts{max-width:680px;margin:0 auto;padding:0 clamp(18px,4vw,26px)}
.gift{padding:clamp(46px,8vh,74px) 0;text-align:center;display:flex;flex-direction:column;align-items:center}
.gift + .gift{border-top:1px solid rgba(233,185,73,.16)}
.num{font:500 11px/1 var(--sans);letter-spacing:.3em;color:var(--gold)}
.gtitle{font:500 clamp(1.7rem,4.2vw,2.4rem)/1.2 var(--serif);color:var(--ink);margin:14px 0 26px}

.giftbox{width:min(250px,68vw);aspect-ratio:1;display:block;margin:0 auto;padding:0;filter:drop-shadow(0 18px 28px rgba(20,0,20,.55));transition:transform .45s ease}
.giftbox:hover{transform:translateY(-4px) rotate(-1.5deg)}
.giftbox:focus-visible{outline:2px solid var(--gold);outline-offset:8px;border-radius:4px}
.giftbox svg{width:100%;height:100%;overflow:visible}
.gb-lid,.gb-bow{transition:transform .65s cubic-bezier(.2,.7,.3,1),opacity .6s ease;transform-box:fill-box;transform-origin:center}
.giftbox.pop{transform:scale(1.04)}
.giftbox.open .gb-lid{transform:translateY(-38px) rotate(-10deg)}
.giftbox.open .gb-bow{transform:translateY(-70px) scale(1.25);opacity:0}
.hint{margin-top:20px;font:500 10px/1 var(--sans);letter-spacing:.24em;text-transform:uppercase;color:var(--rose);transition:color .4s,opacity .4s}
.hint.is-open{color:rgba(220,195,218,.5)}

/* PROGRESS */
#progress{position:fixed;top:18px;right:18px;z-index:95;display:flex;align-items:center;gap:10px;opacity:0;transition:opacity .6s;pointer-events:none}
#progress.show{opacity:1}
#progress .dots{display:flex;gap:5px}
#progress .dot{width:5px;height:5px;border-radius:50%;background:rgba(220,195,218,.28);transition:background .5s,box-shadow .5s}
#progress .dot.on{background:var(--gold);box-shadow:0 0 6px rgba(233,185,73,.7)}
#progress .count{font:500 9.5px/1 var(--sans);letter-spacing:.22em;color:var(--muted)}
#finale{position:fixed;left:0;right:0;bottom:12vh;z-index:96;text-align:center;pointer-events:none;opacity:0;transform:translateY(14px);transition:opacity 1.1s ease,transform 1.1s ease}
#finale.show{opacity:1;transform:none}
#finale p{font:italic 400 clamp(1.1rem,3vw,1.5rem)/1.6 var(--serif);color:var(--ink);text-shadow:0 2px 18px rgba(20,0,20,.8)}
@media (max-width:719px){#progress{top:14px;right:14px}}

/* LIGHTBOX */
#lightbox{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:rgba(16,3,18,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);opacity:0;pointer-events:none;transition:opacity .35s ease}
#lightbox.show{opacity:1;pointer-events:auto}
#lightbox figure{position:relative;max-width:min(88vw,760px);margin:0;transform:scale(.94);transition:transform .35s ease}
#lightbox.show figure{transform:scale(1)}
#lightbox img{width:100%;max-height:78vh;object-fit:contain;box-shadow:0 30px 80px rgba(0,0,0,.7);border:6px solid #fff;background:#f3dbe3}
#lightbox .lb-cap{margin-top:14px;text-align:center;font:italic 400 .95rem/1.5 var(--serif);color:var(--muted)}
#lightbox .lb-btn{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;display:grid;place-items:center;border-radius:50%;background:rgba(251,238,221,.1);border:1px solid rgba(233,185,73,.35);color:var(--ink);font:400 1.3rem/1 var(--serif);transition:background .3s,transform .3s}
#lightbox .lb-btn:hover{background:rgba(251,238,221,.22)}
#lightbox .lb-prev{left:-64px}
#lightbox .lb-next{right:-64px}
#lightbox .lb-close{position:fixed;top:20px;right:22px;width:44px;height:44px;display:grid;place-items:center;border-radius:50%;background:rgba(251,238,221,.1);border:1px solid rgba(233,185,73,.35);color:var(--ink);font:400 1.15rem/1 var(--sans);transition:background .3s}
#lightbox .lb-close:hover{background:rgba(251,238,221,.22)}
@media (max-width:719px){
  #lightbox .lb-prev{left:8px;top:auto;bottom:-58px;transform:none}
  #lightbox .lb-next{right:8px;top:auto;bottom:-58px;transform:none}
}
.sheet figure{cursor:pointer;transition:transform .3s ease,box-shadow .3s ease}
.sheet figure:hover{transform:scale(1.04) rotate(0deg)!important;box-shadow:0 10px 24px rgba(80,10,40,.4);z-index:2;position:relative}

.gbody{width:100%;text-align:left;margin-top:34px;animation:rise .65s ease-out both}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.lede{color:var(--muted);text-align:center;font-size:1.04rem;margin-bottom:20px}

/* PHOTOS SHEET */
.sheet{position:relative;background:linear-gradient(160deg,#fff1f4,#f6d3df);padding:26px 22px 30px;box-shadow:0 22px 44px rgba(20,0,20,.5);border-top:6px solid var(--gold)}
.sheet-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.sheet figure{background:#fff;padding:6px 6px 12px;box-shadow:0 4px 12px rgba(80,10,40,.25)}
.sheet figure:nth-child(odd){transform:rotate(-1.2deg)}
.sheet figure:nth-child(even){transform:rotate(1deg)}
.sheet img{width:100%;aspect-ratio:1;object-fit:cover;background:#f3dbe3}
@media (max-width:460px){.sheet-grid{grid-template-columns:repeat(2,1fr)}}

/* CLIPS */
.media{width:100%;aspect-ratio:1;border:2px solid var(--gold);outline:1px solid rgba(233,185,73,.3);outline-offset:5px;overflow:hidden;background:var(--plum)}
.media video{width:100%;height:100%;object-fit:cover}
.media.portrait{aspect-ratio:342/480;max-width:min(430px,88vw);margin:0 auto;outline-offset:4px}
.caption{margin-top:18px;text-align:center;font:italic 400 1.05rem/1.5 var(--serif);color:var(--muted)}

/* LETTER */
.letter{position:relative;width:100%;background:linear-gradient(170deg,#fff0f2,#f5d6df);color:#3a1530;padding:44px 34px 38px;box-shadow:0 26px 54px rgba(20,0,20,.5);border:1px solid rgba(233,185,73,.55)}
.letter::before{content:"";position:absolute;inset:8px;border:1px solid rgba(122,22,56,.16);pointer-events:none}
.letter .seal{width:54px;height:54px;margin:-71px auto 20px;display:grid;place-items:center;border-radius:50%;background:radial-gradient(circle at 34% 30%,#a12045,#7a1638 62%,#5c0e2a);box-shadow:0 8px 18px rgba(60,5,30,.5),inset 0 2px 4px rgba(255,255,255,.22);font:400 1.5rem/1 var(--black);color:#f3d9a8;border:2px solid rgba(60,5,30,.4);position:relative;z-index:2}
.letter .open{font:600 .9rem/1 var(--serif);letter-spacing:.14em;text-transform:uppercase;color:var(--wine);margin-bottom:1.4em;text-align:center}
.letter p{font-size:clamp(1.05rem,2.3vw,1.2rem);line-height:1.9;margin-bottom:1.1em;color:#3a1530}
.letter .sig{font:italic 500 1.35rem/1 var(--serif);color:var(--wine);margin-top:1.4em;text-align:right}

/* CAKE */
.cake{display:flex;flex-direction:column;align-items:center;width:100%}
.candleWrap{display:flex;flex-direction:column;align-items:center}
.candle{width:clamp(120px,22vw,160px);padding:10px;filter:drop-shadow(0 16px 26px rgba(20,0,20,.55))}
.candle .flame{transform-origin:60px 52px;animation:flicker 2.4s ease-in-out infinite}
.candle .halo{animation:pulse 3.4s ease-in-out infinite}
@keyframes flicker{
  0%,100%{transform:scale(1) rotate(0deg)}
  35%{transform:scale(1.04,.97) rotate(-1deg)}
  70%{transform:scale(.97,1.03) rotate(1deg)}
}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:.85}}
.candle.done .flame{opacity:0;transform:scale(.45) translateY(8px);animation:none;transition:opacity 1.1s,transform 1.1s}
.candle.done .halo{opacity:0;animation:none;transition:opacity 1.1s}
.candle .smoke{opacity:0}
.candle.done .smoke{animation:smoke 3.2s ease-out forwards}
@keyframes smoke{
  0%{opacity:.5;transform:translateY(0) scale(.9)}
  100%{opacity:0;transform:translateY(-46px) scale(1.15)}
}
.cakeNote{margin-top:18px;font:italic 400 clamp(1.02rem,2.4vw,1.22rem)/1.7 var(--serif);color:var(--muted);opacity:0;transition:opacity .8s .4s}
.candleWrap.done .cakeNote{opacity:1}

/* CLOSING */
.closing{text-align:center;max-width:820px;margin:0 auto;padding:clamp(70px,12vh,110px) 24px clamp(40px,6vh,60px);border-top:1px solid rgba(233,185,73,.16)}
.closing h2{font:400 clamp(2rem,7vw,4rem)/1.1 var(--black);background:linear-gradient(95deg,#ff8fb4,#f7d36b,#ff6f9c);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:22px}
.closing .line{width:min(220px,42vw);height:1px;margin:0 auto 22px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.closing p{color:var(--muted);font:italic 400 clamp(1rem,2.2vw,1.15rem)/1.7 var(--serif)}
.closing .last{margin-top:26px;font:500 10px/1 var(--sans);letter-spacing:.26em;text-transform:uppercase;color:var(--rose)}
footer{max-width:780px;margin:0 auto;padding:26px 24px 64px;display:flex;align-items:center;justify-content:space-between;gap:18px;border-top:1px solid var(--line)}
footer .mark{font:400 1.1rem/1 var(--black);color:var(--gold);letter-spacing:.04em}
footer .tools{display:flex;align-items:center;gap:18px}
footer button.link{font:500 10px/1 var(--sans);letter-spacing:.22em;text-transform:uppercase;color:var(--muted);padding:10px 2px;border-bottom:1px solid transparent;transition:color .3s,border-color .3s}
footer button.link:hover{color:var(--ink);border-color:var(--line)}
#sigil{padding:12px;display:grid;place-items:center}
#sigil svg{width:17px;height:17px;transition:transform .4s}
#sigil svg .spk{fill:var(--muted);transition:fill .4s}
#sigil svg .x{fill:none;stroke:var(--muted);stroke-width:1.9;stroke-linecap:round;transition:stroke .4s}
#sigil:hover svg{transform:rotate(-4deg)}
#sigil:hover svg .spk{fill:var(--gold)}
#sigil:hover svg .x{stroke:var(--gold)}

/* SECRET VOICE GIFT */
#secret{max-width:680px;margin:0 auto;padding:0 clamp(18px,4vw,26px) clamp(50px,8vh,80px);text-align:center}
#secret[hidden]{display:none}
#secret .inner{animation:rise .8s ease-out both;border-top:1px solid rgba(233,185,73,.16);padding-top:clamp(40px,7vh,64px)}
#secret .num{font:500 11px/1 var(--sans);letter-spacing:.3em;color:var(--gold)}
#secret h2{font:500 clamp(1.5rem,3.8vw,2.1rem)/1.2 var(--serif);color:var(--ink);margin:14px 0 30px}
#voicePlay{width:84px;height:84px;border-radius:50%;display:inline-grid;place-items:center;background:rgba(232,69,122,.14);border:1px solid rgba(233,185,73,.45);box-shadow:0 12px 34px rgba(20,0,20,.5),0 0 24px rgba(232,69,122,.12);transition:transform .35s ease,box-shadow .35s ease,background .35s ease}
#voicePlay:hover{transform:scale(1.08);background:rgba(232,69,122,.24);box-shadow:0 14px 40px rgba(20,0,20,.55),0 0 34px rgba(232,69,122,.25)}
#voicePlay:focus-visible{outline:2px solid var(--gold);outline-offset:6px}
#voicePlay svg{width:30px;height:30px;fill:var(--gold);transition:opacity .2s}
#voicePlay .icon-pause{display:none}
#voicePlay.playing .icon-play{display:none}
#voicePlay.playing .icon-pause{display:block}
#voicePlay.playing{animation:voicepulse 1.8s ease-in-out infinite}
@keyframes voicepulse{0%,100%{box-shadow:0 12px 34px rgba(20,0,20,.5),0 0 24px rgba(232,69,122,.12)}50%{box-shadow:0 12px 34px rgba(20,0,20,.5),0 0 44px rgba(232,69,122,.35)}}
#secret .voice-note{margin-top:18px;font:italic 400 .95rem/1.5 var(--serif);color:var(--muted)}

:focus-visible{outline:2px solid var(--gold);outline-offset:4px}

@media (max-width:719px){
  .frame{display:none}
  .hero{padding-top:64px}
  .hero h1{line-height:1}
  footer{flex-direction:column;align-items:center;gap:14px}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>

<body>
<div class="frame" aria-hidden="true"></div>
<canvas id="embers" aria-hidden="true"></canvas>
<canvas id="confetti" aria-hidden="true"></canvas>
<div id="bday" aria-hidden="true">
  <div class="inner">
    <h2>HAPPY BIRTHDAY</h2>
    <p class="name">Mantaka. It's today.</p>
    <p class="dismiss">tap anywhere</p>
  </div>
</div>
<div id="progress" aria-hidden="true"><div class="dots" id="pdots"></div><span class="count" id="pcount"></span></div>
<div id="finale" aria-hidden="true"><p>that's all of them.<br>happy birthday, Mantaka. 🎂</p></div>
<div id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer">
  <button class="lb-close" id="lbClose" aria-label="Close">✕</button>
  <figure>
    <img id="lbImg" src="" alt="Photograph">
    <button class="lb-btn lb-prev" id="lbPrev" aria-label="Previous photo">‹</button>
    <button class="lb-btn lb-next" id="lbNext" aria-label="Next photo">›</button>
    <figcaption class="lb-cap" id="lbCap"></figcaption>
  </figure>
</div>

<header class="hero">
  <p class="eyebrow">19 November 2026</p>
  <h1>Mantaka</h1>
  <p class="sub">I made you a small thing. Take your time with it.</p>
  <p class="status" id="status">—</p>
  <p class="cue">keep scrolling</p>
</header>

<main>
  <div class="gifts" id="gifts"></div>
  <noscript><p class="lede" style="padding:40px 24px">This page needs JavaScript to open the gifts.</p></noscript>
</main>

<section class="closing">
  <h2>Happy birthday,<br>Mantaka.</h2>
  <div class="line"></div>
  <p class="last">Try to enjoy it.</p>
</section>

<footer>
  <span class="mark">Rafi</span>
  <div class="tools">
    <button class="link" id="again">Start over</button>
    <button id="sigil" aria-label="A small secret">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path class="spk" d="M3 9.2h3.8L12.5 5v14L6.8 14.8H3z"/>
        <path class="x" d="M16.2 9.4l5 5.2M21.2 9.4l-5 5.2"/>
      </svg>
    </button>
  </div>
</footer>

<section id="secret" hidden>
  <div class="inner">
    <p class="num">✦</p>
    <h2>one more thing</h2>
    <button id="voicePlay" aria-label="Play a voice note">
      <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>
      <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h3.6v14H7zM13.4 5H17v14h-3.6z"/></svg>
    </button>
    <p class="voice-note" id="voiceNote">sound familiar?</p>
  </div>
</section>

<script>
const $ = id => document.getElementById(id);
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
let emberRun = false; /* hoisted: declared before any embers() call */

const KEY = 'mtk.v3';
const store = {
  read(){ try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } },
  save(v){ try { localStorage.setItem(KEY, JSON.stringify(v)); } catch {} }
};
const state = store.read();
state.opened = state.opened || {};

const BOX = uid => `<svg viewBox="0 0 200 200" aria-hidden="true">
  <defs>
    <linearGradient id="${uid}b" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6a9c"/>
      <stop offset="1" stop-color="#d4245f"/>
    </linearGradient>
    <linearGradient id="${uid}g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffe58a"/>
      <stop offset=".5" stop-color="#e9b949"/>
      <stop offset="1" stop-color="#b8861f"/>
    </linearGradient>
  </defs>
  <rect x="30" y="84" width="140" height="106" rx="6" fill="url(#${uid}b)"/>
  <rect x="30" y="84" width="140" height="106" rx="6" fill="none" stroke="#7a0f36" stroke-width="2" opacity=".5"/>
  <rect x="86" y="84" width="28" height="106" fill="url(#${uid}g)"/>
  <g class="gb-lid">

const gifts = $('gifts');

gifts.innerHTML = GIFTS.map((g, i) => `<section class="gift" id="gift-${g.key}">
    <p class="num">${i + 1}</p>
    <h2 class="gtitle">${g.title}</h2>
    <button class="giftbox" type="button" aria-expanded="false" aria-controls="body-${g.key}" aria-label="Open ${g.title}">${BOX('g' + i + '-')}</button>
    <p class="hint">tap to open</p>
    <div class="gbody" id="body-${g.key}" hidden></div>
  </section>`).join('');

function openGift(section, g, instant){
  const btn = section.querySelector('.giftbox');
  const body = section.querySelector('.gbody');
  const hint = section.querySelector('.hint');
  if (btn.classList.contains('open')) return;

  document.querySelectorAll('.gbody video').forEach(v => v.pause());

  btn.setAttribute('aria-expanded', 'true');
  btn.classList.add('open');
  if (!instant) btn.classList.add('pop');
  body.innerHTML = g.body();
  body.hidden = false;
  hint.textContent = 'open';
  hint.classList.add('is-open');

  state.opened[g.key] = true;
  store.save(state);

  if (g.init) g.init(section);
  body.querySelectorAll('video').forEach(v => {
    v.muted = true;
    v.addEventListener('click', () => {
      if (v.paused) v.play().catch(() => {});
      else v.pause();
    });
    if (!reduced){
      /* preload="none" means we must kick off loading ourselves,
         then wait a beat so the just-inserted node can actually play */
      v.load();
      const tryPlay = () => v.play().catch(() => {});
      requestAnimationFrame(() => requestAnimationFrame(tryPlay));
      v.addEventListener('canplay', tryPlay, { once: true });
      /* some browsers dismiss a play() requested too early; retry briefly */
      let retries = 0;
      const iv = setInterval(() => {
        if (!v.paused || ++retries > 10 || !document.contains(v)) clearInterval(iv);
        else tryPlay();
      }, 400);
    }
  });

  if (!instant){
    embers(26);
    setTimeout(() => btn.classList.remove('pop'), 700);
    /* make sure the revealed content is actually on screen */
    setTimeout(() => {
      const r = body.getBoundingClientRect();
      if (r.top > innerHeight * 0.55 || r.bottom < 0){
        body.scrollIntoView({ behavior: reduced ? 'auto' : 'smooth', block: 'center' });
      }
    }, 380);
  }
  if (!instant) updateProgress();
}

gifts.addEventListener('click', e => {
  const btn = e.target.closest('.giftbox');
  if (!btn) return;
  const section = btn.closest('.gift');
  const i = [...gifts.children].indexOf(section);
  openGift(section, GIFTS[i], false);
});

/* restore gifts opened on a previous visit */
GIFTS.forEach((g, i) => {
  if (state.opened[g.key]) openGift(gifts.children[i], g, true);
});

/* ---------------- status + birthday trigger ---------------- */
const BDAY = { MONTH: 10, DAY: 19 }; /* November 19 */
function isBirthday(d = new Date()){
  return d.getMonth() === BDAY.MONTH && d.getDate() === BDAY.DAY;
}
(function(){
  const now = new Date();
  const today = isBirthday(now);
  let next = new Date(now.getFullYear(), BDAY.MONTH, BDAY.DAY);
  if (next < now && !today) next = new Date(now.getFullYear() + 1, BDAY.MONTH, BDAY.DAY);
  const days = Math.ceil((next - now) / 864e5);
  const statusEl = $('status');
  statusEl.textContent = today ? "it's today ✦ happy birthday"
    : days === 1 ? 'tomorrow'
    : `in ${days} days`;
  if (today) statusEl.classList.add('bday-today');
})();

/* fire immediately if the page loads on her birthday,
   and arm a timer so it also fires live at midnight */
let bdayFired = false;
function birthdayCelebration(){
  if (bdayFired) return;
  bdayFired = true;
  $('status').textContent = "it's today ✦ happy birthday";
  $('status').classList.add('bday-today');
  const overlay = $('bday');
  overlay.classList.add('show');
  confettiStorm();
  setTimeout(confettiStorm, 1400);
  const dismiss = () => {
    overlay.classList.remove('show');
    overlay.removeEventListener('click', dismiss);
  };
  overlay.addEventListener('click', dismiss);
  setTimeout(dismiss, 9000);
}
if (isBirthday()) setTimeout(birthdayCelebration, 900);
(function armMidnight(){
  const now = new Date();
  const midnight = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 0, 50);
  setTimeout(() => {
    if (isBirthday()) birthdayCelebration();
    armMidnight();
  }, midnight - now);
})();

/* ---------------- confetti storm ---------------- */
const confCanvas = $('confetti');
const cx2 = confCanvas.getContext('2d');
let confRun = false;
function confettiStorm(){
  if (reduced || confRun) return;
  confRun = true;
  const dpr = Math.min(devicePixelRatio || 1, 2);
  const W = innerWidth, H = innerHeight;
  confCanvas.width = W * dpr; confCanvas.height = H * dpr;
  cx2.setTransform(dpr, 0, 0, dpr, 0, 0);
  const COLORS = ['#ff7aa6', '#e8457a', '#e9b949', '#fbeedd', '#ff8fb4', '#f7d36b', '#0f5a52'];
  const pick = () => COLORS[(Math.random() * COLORS.length) | 0];
  const mk = (x, y, ang, speed) => ({
    x, y,
    vx: Math.cos(ang) * speed * (0.6 + Math.random() * 0.8),
    vy: Math.sin(ang) * speed * (0.6 + Math.random() * 0.8),
    w: 5 + Math.random() * 6, h: 7 + Math.random() * 9,
    rot: Math.random() * 6.28, vr: -0.12 + Math.random() * 0.24,
    sway: Math.random() * 6.28,
    c: pick(), ttl: 260 + Math.random() * 120
  });
  const ps = [];
  /* two corner cannons + a center burst from the bottom */
  for (let i = 0; i < 90; i++) ps.push(mk(0, H * 0.75, -Math.PI / 3.2, 11 + Math.random() * 7));
  for (let i = 0; i < 90; i++) ps.push(mk(W, H * 0.75, -Math.PI + Math.PI / 3.2, 11 + Math.random() * 7));
  for (let i = 0; i < 110; i++) ps.push(mk(W / 2, H + 10, -Math.PI / 2 + (Math.random() - .5) * .9, 13 + Math.random() * 8));
  let frames = 0;
  (function frame(){
    cx2.clearRect(0, 0, W, H);
    ps.forEach(p => {
      p.ttl--;
      p.sway += .05;
      p.vy += .16;                 /* gravity */
      p.vx *= .992;                /* drag */
      p.vy *= .992;
      p.x += p.vx + Math.sin(p.sway) * .7;
      p.y += p.vy;
      p.rot += p.vr;
      if (p.ttl > 0 && p.y < H + 30){
        cx2.save();
        cx2.translate(p.x, p.y);
        cx2.rotate(p.rot);
        cx2.globalAlpha = Math.min(1, p.ttl / 60);
        cx2.fillStyle = p.c;
        cx2.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        cx2.restore();
      }
    });
    frames++;
    if (frames < 420 && ps.some(p => p.ttl > 0 && p.y < H + 30)) requestAnimationFrame(frame);
    else { cx2.clearRect(0, 0, W, H); confRun = false; }
  })();
}

/* ---------------- secret voice gift ---------------- */
const voiceAudio = new Audio('assets/voice.mp3');
voiceAudio.preload = 'auto';
const voiceBtn = $('voicePlay');
const voiceNote = $('voiceNote');
let voiceUnlocked = !!state.secret;
let voicePlays = 0; /* per visit — first play is muffled, second is the real thing */

voiceBtn.addEventListener('click', () => {
  if (voiceAudio.paused){
    /* a "new listen" only counts when starting from the top */
    if (voiceAudio.currentTime < 0.5) voicePlays++;
    if (voicePlays <= 1){
      /* quiet and a touch slow — like the file didn't come through right */
      voiceAudio.volume = 0.25;
      voiceAudio.playbackRate = 0.85;
    } else {
      voiceAudio.volume = 1;
      voiceAudio.playbackRate = 1;
    }
    voiceAudio.play().then(() => {
      voiceBtn.classList.add('playing');
      voiceNote.textContent = 'playing…';
    }).catch(() => {
      voiceNote.textContent = 'this one is still being wrapped';
    });
  } else {
    voiceAudio.pause();
  }
});
function voiceCaption(){
  if (voicePlays === 1) return 'huh… maybe try again?';
  if (voicePlays === 2) return 'there we go.';
  return 'sound familiar?';
}
voiceAudio.addEventListener('pause', () => {
  voiceBtn.classList.remove('playing');
  /* 'pause' also fires when the clip ends — the ended handler
     runs after and sets the final caption, so order is safe */
  voiceNote.textContent = voiceCaption();
});
voiceAudio.addEventListener('ended', () => {
  voiceBtn.classList.remove('playing');
  voiceNote.textContent = voiceCaption();
  voiceAudio.currentTime = 0; /* so the next tap counts as a fresh listen */
});

function unlockSecret(instant){
  if (voiceUnlocked && !instant) return;
  voiceUnlocked = true;
  state.secret = true; store.save(state);
  const sec = $('secret');
  sec.hidden = false;
  if (!instant){
    embers(60);
    setTimeout(() => sec.scrollIntoView({ behavior: reduced ? 'auto' : 'smooth', block: 'center' }), 500);
  }
}
if (voiceUnlocked) unlockSecret(true);

let taps = 0, tapTimer;
$('sigil').addEventListener('click', () => {
  taps++;
  clearTimeout(tapTimer);
  tapTimer = setTimeout(() => { taps = 0; }, 1400);
  if (taps === 5){
    taps = 0;
    unlockSecret(false);
  }
});

/* ---------------- embers ---------------- */
const emberCanvas = $('embers');
const ex = emberCanvas.getContext('2d');

function embers(count = 30){
  if (reduced || emberRun) return;
  const dpr = Math.min(devicePixelRatio || 1, 2);
  const W = innerWidth, H = innerHeight;
  emberCanvas.width = W * dpr; emberCanvas.height = H * dpr;
  ex.setTransform(dpr, 0, 0, dpr, 0, 0);

  const ps = Array.from({ length: count }, () => ({
    x: W / 2 + (Math.random() - .5) * Math.min(W * .6, 420),
    y: H * (0.55 + Math.random() * .3),
    vx: (Math.random() - .5) * .9,
    vy: -(.5 + Math.random() * 1.7),
    r: .8 + Math.random() * 2.2,
    a: .35 + Math.random() * .5,
    sway: Math.random() * 6.28,
    c: Math.random() < .5 ? '255,122,166' : '233,185,73'
  }));

  emberRun = true;
  (function frame(){
    ex.clearRect(0, 0, W, H);
    ps.forEach(p => {
      p.sway += .03;
      p.x += p.vx + Math.sin(p.sway) * .4;
      p.y += p.vy;
      p.a -= .006;
      if (p.a <= 0) return;
      const g = ex.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 4);
      g.addColorStop(0, `rgba(${p.c},${p.a})`);
      g.addColorStop(.5, `rgba(${p.c},${p.a * .35})`);
      g.addColorStop(1, `rgba(${p.c},0)`);
      ex.fillStyle = g;
      ex.beginPath(); ex.arc(p.x, p.y, p.r * 4, 0, 6.2832); ex.fill();
    });
    if (ps.some(p => p.a > 0)) requestAnimationFrame(frame);
    else { ex.clearRect(0, 0, W, H); emberRun = false; }
  })();
}

/* ---------------- progress + finale ---------------- */
const progressEl = $('progress'), pdots = $('pdots'), pcount = $('pcount'), finale = $('finale');
pdots.innerHTML = GIFTS.map(() => '<span class="dot"></span>').join('');
let finaleShown = !!state.finale;

function updateProgress(){
  const opened = GIFTS.filter(g => state.opened[g.key]).length;
  if (opened === 0) { progressEl.classList.remove('show'); return; }
  progressEl.classList.add('show');
  [...pdots.children].forEach((d, i) => d.classList.toggle('on', i < opened));
  pcount.textContent = opened === GIFTS.length ? 'all opened' : `${opened} / ${GIFTS.length}`;
  if (opened === GIFTS.length && !finaleShown){
    finaleShown = true;
    state.finale = true; store.save(state);
    setTimeout(() => {
      finale.classList.add('show');
      embers(80);
      setTimeout(() => embers(50), 900);
      setTimeout(() => finale.classList.remove('show'), 9000);
    }, 1200);
  }
}
updateProgress();

/* ---------------- lightbox ---------------- */
const lb = $('lightbox'), lbImg = $('lbImg'), lbCap = $('lbCap');
let lbIndex = 0, lbOpen = false;

function lbShow(i){
  lbIndex = (i + PHOTO_COUNT) % PHOTO_COUNT;
  const n = String(lbIndex + 1).padStart(2, '0');
  lbImg.src = `assets/photos/${n}.jpg`;
  lbImg.alt = `Photograph ${lbIndex + 1}`;
  lbCap.textContent = `${lbIndex + 1} / ${PHOTO_COUNT}`;
}
function lbOpenAt(i){
  lbShow(i);
  lb.classList.add('show');
  lbOpen = true;
  document.body.style.overflow = 'hidden';
}
function lbHide(){
  lb.classList.remove('show');
  lbOpen = false;
  document.body.style.overflow = '';
  lbImg.src = '';
}
gifts.addEventListener('click', e => {
  const fig = e.target.closest('.sheet figure');
  if (fig) lbOpenAt(+fig.dataset.i);
});
$('lbClose').addEventListener('click', lbHide);
$('lbPrev').addEventListener('click', () => lbShow(lbIndex - 1));
$('lbNext').addEventListener('click', () => lbShow(lbIndex + 1));
lb.addEventListener('click', e => { if (e.target === lb) lbHide(); });
addEventListener('keydown', e => {
  if (!lbOpen) return;
  if (e.key === 'Escape') lbHide();
  else if (e.key === 'ArrowLeft') lbShow(lbIndex - 1);
  else if (e.key === 'ArrowRight') lbShow(lbIndex + 1);
});
</script>
